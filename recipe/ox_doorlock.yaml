$engine: 3
$onesync: on
name: ox_doorlock NODE7
author: Overextended / NODE7 integration
description: RedM door locking with NODE7 inventory, notifications and lockpick minigame.
tasks:
  - action: ensure_dir
    path: ./resources/[node7]/ox_doorlock
  - action: copy_path
    src: ./ox_doorlock
    dest: ./resources/[node7]/ox_doorlock
  - action: connect_database
  - action: query_database
    file: ./resources/[node7]/ox_doorlock/sql/ox_doorlock.sql
  - action: append_file
    file: ./server.cfg
    text: |
      exec @ox_doorlock/permissions.cfg
      ensure ox_doorlock
